# User-authored guidelines. Each entry binds a rule `id` (implemented in
# src/rules/) to its parameters. `label` is the Japanese display name shown in
# the app (rule ids stay English). Edit freely — tuning needs no code change.
#
# Role: Support (teamPosition=UTILITY). Selected via the sidebar role
# selector, or auto-detected from the match. See src/eval/roles.py.
#
# NOTE: unlike guidelines_adc.yaml (sourced from the user's own ADC theory
# PDF), these are v1 *starting values* based on general, well-known LoL role
# norms — not yet validated against the user's own real matches. Retune
# after reviewing a few matches, same as guidelines_adc.yaml's
# wards_per_interval note already does for ADC.
rules:
  - id: cs_per_minute
    label: "CS/分（15分）"
    enabled: false  # support doesn't farm by role design — see note below
    description: "Disabled: support items don't need CS, and taking minions
      steals gold from the ADC instead. Params kept (inert while disabled)
      in case you want to re-enable it for a specific build/matchup check."
    params:
      minute: 15
      min_cs_per_min: 2.0

  - id: deaths_before_minute
    label: "早期デス"
    enabled: true
    description: "Avoid dying too early."
    params:
      before_minute: 8
      max_deaths: 1

  - id: boots_type_match
    label: "防御靴の型"
    enabled: true
    description: "If you built defensive boots, are they the right resist type
      for the damage you took? (Offensive/no boots are not evaluated.)"
    params:
      threshold: 0.6

  - id: not_behind_at_minute
    label: "15分レーン差"
    enabled: true
    description: "Not significantly behind at 15:00. Gold only (no CS check
      — support doesn't farm by design; max_cs_deficit omitted). Tighter
      gold band than ADC: a support's total gold pool is much smaller, so
      the same absolute deficit is proportionally larger."
    params:
      minute: 15
      max_gold_deficit: 300
      max_level_deficit: 1

  - id: isolated_deaths
    label: "孤立デス"
    enabled: true
    description: "Don't die with no teammate nearby (walking first / alone).
      Zero tolerance — support is expected to always be positioned with a
      teammate (usually the ADC), unlike solo lanes."
    params:
      max_deaths: 0
      nearby_radius: 2500

  - id: low_hp_deaths
    label: "低HPデス"
    enabled: true
    description: "Don't die after already being low HP (back off / recall)."
    params:
      health_pct: 0.35
      max_deaths: 1

  - id: frontmost_deaths
    label: "最前線デス"
    enabled: false  # see caveat below before enabling
    description: "Flag deaths where you were the most-forward teammate
      (engaged/dove first). Caveat: only evaluated when >=1 ally was within
      nearby_radius — a fully isolated death can't be classified as
      'frontmost of the group', so this under-counts the riskiest deaths.
      Support is a backline role — being frontmost is more clearly a
      misplay than for a bruiser/tank role. Disabled by default; enable
      once you've reviewed a few matches' evidence and are comfortable with
      the blind spot above."
    params:
      max_deaths: 1
      nearby_radius: 2000

  - id: death_cause_summary
    label: "デス要因サマリー"
    enabled: true
    description: "Informational only (always passes): breakdown of deaths by
      killer champion and top damage source, to support 'analyze your
      deaths'."
    params: {}

  - id: kill_participation
    label: "キル関与率"
    enabled: true
    description: "(Kills + assists) / team kills meets a target rate. Uses
      Riot's own challenges.killParticipation stat. Highest target of the 5
      roles alongside Jungle — support is a roam/playmaking role expected
      in most fights."
    params:
      min_participation: 0.65

  - id: wards_per_interval
    label: "視界確保ペース"
    enabled: true
    description: "Wards placed keep pace across fixed intervals through the
      laning phase. Highest target of the 5 roles — vision is support's
      primary job. Still meant as an achievable 'good support' bar, not a
      max."
    params:
      interval_minutes: 3
      min_wards_per_interval: 2
      through_minute: 15
